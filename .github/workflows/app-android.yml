# Gera o aplicativo Android (APK para instalar direto e AAB para a Google Play)
# a cada mudança em aplicativo/, e publica os arquivos numa Release do GitHub.
#
# Assinatura: cadastre em Settings → Secrets and variables → Actions:
#   IECB_UPLOAD_KEYSTORE_BASE64  (o arquivo .jks em base64)
#   IECB_UPLOAD_STORE_PASSWORD, IECB_UPLOAD_KEY_ALIAS, IECB_UPLOAD_KEY_PASSWORD
# Sem esses segredos, os arquivos saem sem assinatura (para assinar à parte).
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aplicativo/**"
      - ".github/workflows/app-android.yml"

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: aplicativo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicativo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependências
        run: npm ci

      - name: Conferir tipos
        run: npx tsc --noEmit

      - name: Gerar projeto Android
        run: npx expo prebuild -p android --no-install

      - name: Chave de envio (se cadastrada)
        env:
          KEYSTORE_B64: ${{ secrets.IECB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "IECB_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "ASSINADO=1" >> "$GITHUB_ENV"
          else
            echo "ASSINADO=0" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK e AAB
        working-directory: aplicativo/android
        env:
          IECB_UPLOAD_STORE_PASSWORD: ${{ secrets.IECB_UPLOAD_STORE_PASSWORD }}
          IECB_UPLOAD_KEY_ALIAS: ${{ secrets.IECB_UPLOAD_KEY_ALIAS }}
          IECB_UPLOAD_KEY_PASSWORD: ${{ secrets.IECB_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Juntar os arquivos
        run: |
          VERSAO=$(node -p "require('./app.json').expo.version")
          CODIGO=$(node -p "require('./app.json').expo.android.versionCode")
          mkdir -p ../saida
          SUF=$([ "$ASSINADO" = 1 ] && echo "" || echo "-sem-assinatura")
          cp android/app/build/outputs/apk/release/*.apk "../saida/iecb-membros-$VERSAO$SUF.apk"
          cp android/app/build/outputs/bundle/release/*.aab "../saida/iecb-membros-$VERSAO$SUF.aab"
          if [ "$ASSINADO" = 0 ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            cp "$BT/lib/apksigner.jar" ../saida/apksigner.jar
          fi
          echo "TAG=app-android-v$VERSAO-$CODIGO-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          ls -la ../saida

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTA="Aplicativo dos membros $VERSAO (Android). APK para instalar direto; AAB para a Google Play."
          [ "$ASSINADO" = 0 ] && NOTA="$NOTA Arquivos sem assinatura: cadastre a chave de envio nos segredos do repositório."
          gh release create "$TAG" ../saida/* --title "App Android $VERSAO (build ${GITHUB_RUN_NUMBER})" --notes "$NOTA" --prerelease
